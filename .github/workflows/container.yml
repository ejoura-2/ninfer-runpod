name: Build container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ninfer-runpod
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime image
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/ninfer-runpod:latest"
          docker pull "$image"
          docker run --rm --entrypoint python3 "$image" -c \
            'import http.client, http.server; print("Python HTTP runtime OK")'
          docker run --rm --entrypoint sh "$image" -c \
            'ldd /usr/local/bin/ninfer-serve | tee /tmp/ldd.txt; ! grep "not found" /tmp/ldd.txt | grep -v "libcuda.so.1"'
          docker run --rm --entrypoint test "$image" -x /usr/local/bin/ninfer-serve
